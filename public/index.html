<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Dreams</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; height: 100vh; }
    #terminal { flex: 1; overflow: hidden; }
    #input-row { display: flex; background: #111; padding: 4px 8px; border-top: 1px solid #333; }
    #cmd { flex: 1; background: transparent; border: none; color: #ccc; font-family: monospace; font-size: 14px; outline: none; }
    #send { background: #333; color: #ccc; border: none; padding: 4px 12px; cursor: pointer; font-family: monospace; margin-left: 8px; }
    #send:hover { background: #555; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <div id="terminal"></div>
  <div id="input-row">
    <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="enter command..." />
    <button id="send">send</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      theme: { background: '#000000', foreground: '#cccccc' },
      convertEol: true,
      scrollback: 1000,
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();
    window.addEventListener('resize', () => fitAddon.fit());

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}`);
    let sessionToken = sessionStorage.getItem('terminal-dreams-token');
    let firstMessage = true;

    ws.onopen = () => {
      // Send reconnect token or empty string for new session
      ws.send(sessionToken || '');
    };

    ws.onmessage = (e) => {
      if (firstMessage) {
        firstMessage = false;
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'session') {
            sessionToken = msg.token;
            sessionStorage.setItem('terminal-dreams-token', sessionToken);
            return;
          }
        } catch (_) {}
      }
      term.write(e.data);
    };

    ws.onclose = () => term.write('\r\n\r\n[Connection closed]\r\n');
    ws.onerror = () => term.write('\r\n[Connection error]\r\n');

    function sendCmd() {
      const val = document.getElementById('cmd').value.trim();
      if (!val || ws.readyState !== WebSocket.OPEN) return;
      term.write(val + '\r\n');
      ws.send(val);
      document.getElementById('cmd').value = '';
    }

    document.getElementById('send').addEventListener('click', sendCmd);
    document.getElementById('cmd').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendCmd();
    });
  </script>
</body>
</html>
